<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" co    ntent="width=device-width, initial-scale=1.0">
    <title>Pilihan Kelas - Dropdown</title>
    <link rel="stylesheet" href="sukii.css">
</head>
<body>

    <div class="dropdown-container">
        <label for="pilih-kelas" class="dropdown-label">Pilih Kelas Anda:</label>
        
        <select id="pilih-kelas" name="kelas" class="dropdown-select" required>
            <option value="" disabled selected>-- Pilih Kelas --</option>
            <option value="10">Kelas 10</option>
            <option value="11">Kelas 11</option>
            <option value="12">Kelas 12</option>
        </select>
    </div>

</body>
</html>
