<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
<section id="loginpage" class="page">

        <img class="GambarOsis" src="pictures/Logo OSIS ACC.PNG" widht="205" height="105">
    </div>

    <div class="login_box">
            <input class="namapengguna" type="text" placeholder="Ex.King Berlie Immanuel"><br><br>

                <option value="" disabled selected>Pilih Kelas</option>
                <option value="1">10.1</option>
                <option value="2">10.2</option>

                <option value="7">11.2</option>
                <option value="8">11.3</option>
                <option value="9">11.4</option>
                <option value="10">11.5</option>
                <option value="11">12.1</option>
                <option value="12">12.2</option>
                <option value="13">12.3</option>
                <option value="14">12.4</option>
                <option value="15">12.5</option>
            </select><br>
            <input class="Password" type="text" placeholder="Masukan Password disini"><br>
            <button type="submit">Login</button>





            
    </div>
</section>
</body>
</html>
